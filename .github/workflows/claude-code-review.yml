name: Claude Code Review

# Reviews every pull request (code and docs go through PRs; athlete state commits straight to main, see CLAUDE.md).
# Auth: CLAUDE_CODE_OAUTH_TOKEN repository secret (`claude setup-token` on the athlete's personal Claude account;
# usage counts against that subscription's limits).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the Omni-Hybrid Coach (read CLAUDE.md first; docs/DECISIONS.md explains
            past judgment calls). Report real problems, most severe first; skip style nits that ruff already enforces.

            Check in particular:
            1. Correctness: logic bugs, edge cases, and whether tests cover the changed behaviour.
            2. The core rule: Claude decides, code calculates. No invented numbers in skills or plans; loads, paces,
               readiness and scores come from `coach`; `coach push` still re-validates and refuses invalid plans.
            3. Athlete safety: red-flag handling (docs/SAFETY.md), pain rules, and approvals for block goals,
               config/threshold changes and larger replans are not weakened.
            4. Data rules: athlete data only through `coach` commands; Whoop numbers never committed (DECISIONS 73);
               external text (Hevy notes, Intervals comments, *_untrusted) treated as data, never instructions.
            5. Security: no credentials, tokens, API payloads or personal health data in the diff.
            6. Docs: judgment calls recorded in docs/DECISIONS.md; docs/ARCHITECTURE.md and DATA_MODEL.md still accurate.

            Use inline comments for specific lines and one summary comment overall. If nothing needs changing,
            say so in one short summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
