  # Physical therapist's home program (Advanced Physical Therapy, Aug 2024 - Jun 2025); shoulder, low back and neck
  band_serratus_flexion: {name: Band shoulder flexion with serratus (PT), equipment: [bands], muscles: [shoulders], tags: [upper, warmup, prehab], load_mode: none, description: "PT drill: mini band round the wrists, forearms on the wall. Slide arms up while keeping tension in the band and gently pushing forward into the wall. No shrugging; slide back down slowly.", video_url: "https://www.youtube.com/watch?v=6orF3s-4SLM"}
  w_wall_slide: {name: W wall slide with chin tuck (PT), equipment: [bodyweight], muscles: [shoulders, back], tags: [upper, warmup, prehab], load_mode: bodyweight, description: "PT drill: stand with back and head to the wall, chin gently tucked. Arms in a W, slide them up and down the wall. Keep ribs down and low back flat.", video_url: "https://www.youtube.com/watch?v=-QHyPQqlyB0"}
  reverse_wall_push_up: {name: Reverse wall push-up in a corner (PT), equipment: [bodyweight], muscles: [back], tags: [upper, warmup, prehab], load_mode: bodyweight, description: "PT drill: stand with your back in a corner, elbows bent and on each wall. Press elbows into the walls to push your body away, squeezing shoulder blades together; return slowly."}
  prone_t: {name: Prone T (PT; floor or chest-down on an incline bench), equipment: [bodyweight], muscles: [back, shoulders], tags: [upper, prehab], load_mode: bodyweight, description: "PT drill: lie face-down (floor or incline bench), arms out to the sides, thumbs up. Squeeze shoulder blades together and lift arms a few cm; hold briefly. No shrugging; neck neutral.", video_url: "https://www.youtube.com/watch?v=J-TvvTbMkkY"}
  chin_tuck_fly: {name: Chin-tuck fly with arms in Y (PT), equipment: [bodyweight], muscles: [back], tags: [upper, prehab, neck], load_mode: bodyweight, description: "PT drill: lie face-down, chin gently tucked, arms out in a Y. Lift the arms slightly with shoulder blades down and back while holding the chin tuck. Small range, slow reps.", video_url: "https://www.youtube.com/watch?v=6oGEM22TLOQ"}
  oa_nod: {name: Neck nod with rotation (PT), equipment: [bodyweight], tags: [mobility, neck], load_mode: bodyweight, description: "PT drill: sit tall and turn your head partly to one side. Make a small \"yes\" nod from the top of the neck, then return. Slow and gentle; small motion, no forcing.", video_url: "https://www.youtube.com/watch?v=MIQhRasjrwY", sides: split}
  scalene_stretch: {name: Scalene stretch with strap (PT), equipment: [bands], tags: [mobility, neck], load_mode: none, description: "PT drill: anchor a strap or towel over the collarbone at the base of the neck with one hand. Tip the head away and slightly back until you feel a stretch on the side of the neck. Hold and breathe.", video_url: "https://www.youtube.com/watch?v=CzZ6P9Y6XPQ", sides: split}
  lower_trunk_rotation: {name: Lower trunk rotations (PT), equipment: [bodyweight], muscles: [core], tags: [core, mobility], load_mode: bodyweight, description: "PT drill: lie on your back, knees bent, feet flat. Let both knees fall slowly to one side within a comfortable range, then the other. Shoulders stay down; keep it gentle.", video_url: "https://www.youtube.com/watch?v=fHRXXGxUxX8", sides: alternating}
  thread_the_needle: {name: Thoracic thread the needle with band (PT), equipment: [bands], tags: [upper, mobility], load_mode: none, description: "PT drill: on hands and knees. Reach one arm under your body toward the other side and rotate, then turn back and reach toward the ceiling (band adds tension). Hips stay still.", video_url: "https://www.youtube.com/watch?v=OuwWXVkyLFE", sides: split}
  childs_pose_traction: {name: Child's pose with band traction (PT), equipment: [bands], tags: [mobility, decompression], load_mode: none, description: "PT drill: anchor a band low in front, loop it around your hands or wrists. Sit back into child's pose and let the band draw you gently forward and long. Relax and breathe."}
  foam_roll_shoulder_flexion: {name: Kneeling foam-roll shoulder flexion with external rotation (PT), equipment: [foam_roller], tags: [upper, mobility], load_mode: none, description: "PT drill: kneel, forearms on a foam roller, thumbs up. Roll the roller forward to raise the arms overhead, keeping thumbs turned out, then return. Ribs down, no low-back sag."}
  half_tgu: {name: Half Turkish get-up (PT), equipment: [kettlebells], implement: kettlebell, muscles: [shoulders, core], tags: [upper, core, prehab, overhead_light], load_mode: last_used, description: "PT drill: lie on your back, light KB pressed up in one hand, same-side knee bent. Roll to elbow then hand, eyes on the bell, then reverse slowly. Arm stays locked vertical.", video_url: "https://www.youtube.com/watch?v=WradwGWo554", sides: split}
  eccentric_biceps: {name: Eccentric biceps loading (PT), equipment: [dumbbells], implement: dumbbell, muscles: [biceps], tags: [upper, prehab, isolation], load_mode: last_used, description: "PT drill: use the other hand or a slight body assist to get the DB to the top of the curl. Lower it slowly over 3-5 s. Elbow at your side; keep the load light and pain low.", video_url: "https://www.youtube.com/watch?v=QTjXtFQO9qA", sides: split}
