# Exercise library. The validator rejects any exercise not listed here.
# Fields: name, equipment (all required), implement (load rounding), muscles (primary, count toward hard sets),
# tags, family/rung (movement readiness gate), requires (extra family rungs), regressions (swap order),
# deload_swap (concentric / low-impact alternative), skill (skills.yaml id), load_mode (e1rm | last_used | bodyweight | kb | none),
# hevy_title (Hevy exercise title used to match logged sets), hevy_template_id (filled in Phase 2),
# estimate_from (e1RM estimate from a related lift when there's no history; DB factors are per dumbbell).
defaults: {implement: none, muscles: [], tags: [], regressions: [], load_mode: none, hevy_template_id: null}
exercises:
  # ---------- warm-up, prehab, mobility, cool-down ----------
  mcgill_curl_up: {name: McGill curl-up, equipment: [bodyweight], tags: [core, mcgill, warmup], load_mode: bodyweight, description: "Lie on your back, one knee bent, hands under your low back. Brace and lift head and shoulders a few cm as one unit; hold 8-10 s. Keep the low-back curve, no chin tuck or crunching.", video_url: "https://www.youtube.com/watch?v=vLpHJ1Cxj6k"}
  side_plank: {name: Side plank, equipment: [bodyweight], tags: [core, mcgill, warmup, isometric], load_mode: bodyweight, hevy_title: "Side Plank", sides: split}
  bird_dog: {name: Bird dog, equipment: [bodyweight], tags: [core, mcgill, warmup], load_mode: bodyweight, hevy_title: "Bird Dog", sides: alternating}
  tib_raise: {name: Tibialis raise, equipment: [tib_raise], muscles: [calves], tags: [lower, warmup, prehab], load_mode: last_used, implement: machine, regressions: [tib_raise_wall], description: "Stand on the tib bar with the pad over your feet, back to a support. Pull toes up toward your shins as high as you can, lower slowly. Keep knees soft and hips still.", video_url: "https://www.youtube.com/watch?v=dnxy5DhY0Ks"}
  tib_raise_wall: {name: Wall tibialis raise, equipment: [bodyweight], tags: [lower, warmup, prehab], load_mode: bodyweight, description: "Lean your back and hips on a wall, heels about a foot out. Lift toes toward shins as high as you can, lower slowly. Further from the wall is harder; keep legs straight.", video_url: "https://www.youtube.com/watch?v=O8ZcXfwFuqs"}
  pogo_hops: {name: Pogo hops, equipment: [bodyweight], tags: [lower, warmup, plyo_low, achilles_load], load_mode: bodyweight, regressions: [ankle_rocker], description: "Small, quick two-foot bounces on the balls of your feet with stiff ankles and nearly straight knees. Minimal ground contact, heels barely touching; stay tall and quiet.", video_url: "https://www.youtube.com/watch?v=lz6BM6WyJ0k"}
  ankle_rocker: {name: Ankle rocker, equipment: [bodyweight], tags: [lower, warmup, mobility], load_mode: bodyweight, description: "Half-kneel or stand in a split stance. Drive the front knee forward over the toes as far as you can without the heel lifting, then rock back. Smooth reps, foot arch stays up.", video_url: "https://www.youtube.com/watch?v=uI_S4kRDIhY", sides: split}
  couch_stretch: {name: Couch stretch, equipment: [bodyweight], tags: [lower, warmup, mobility], load_mode: bodyweight, description: "Back knee on a pad against a wall/bench, shin up the wall, front foot planted. Squeeze the glute of the back leg and keep ribs down so the stretch is in the front hip, not the low back.", video_url: "https://www.youtube.com/watch?v=7bW0dBwB7Dc", sides: split}
  band_pull_apart: {name: Band pull-apart, equipment: [bands], tags: [upper, warmup, prehab], load_mode: none, hevy_title: "Band Pullaparts"}
  scap_push_up: {name: Scapular push-up, equipment: [bodyweight], tags: [upper, warmup, prehab], load_mode: bodyweight, description: "Plank on hands with straight arms. Let the chest sink between the shoulder blades, then push the floor away to spread them. Elbows stay locked; only the shoulder blades move.", video_url: "https://www.youtube.com/watch?v=LeMk15TN0No"}
  thoracic_open_book: {name: Thoracic open book, equipment: [bodyweight], tags: [upper, warmup, mobility], load_mode: bodyweight, description: "Lie on your side, hips and knees at 90 deg, arms together in front. Open the top arm across to the other side, following with your eyes; knees stay stacked so the turn comes from the mid-back.", video_url: "https://www.youtube.com/watch?v=rDviWORCWEw", sides: split}
  bottoms_up_kb_press: {name: Bottoms-up KB press, equipment: [kettlebells], tags: [upper, warmup, prehab, overhead_light], implement: kettlebell, load_mode: kb, description: "Hold a light KB upside down by the handle at shoulder height, forearm vertical, tight grip. Press straight up slowly, keeping the bell balanced; ribs down, no lean back.", video_url: "https://www.youtube.com/watch?v=akIl01m506w", sides: split}
  crossover_symmetry_activation: {name: Crossover Symmetry activation, equipment: [crossover_symmetry], tags: [upper, warmup, prehab], load_mode: none, description: "Face the Crossover Symmetry bands and run the activation series (rows, pulls, raises, rotations) at light tension. Shoulder blades down and back, slow reps, no shrugging.", video_url: "https://www.youtube.com/watch?v=dtKNgpurCe4"}
  cable_external_rotation: {name: Cable external rotation, equipment: [cable_crossover], muscles: [shoulders], tags: [upper, prehab, isolation], implement: cable, load_mode: last_used, description: "Stand side-on to a cable at elbow height, towel between elbow and ribs, elbow at 90 deg. Rotate the hand out away from your body and return slowly; elbow stays pinned to your side.", video_url: "https://www.youtube.com/watch?v=vjUE_9BsPUU", sides: split}
  ytw_raise: {name: Prone Y-T-W raise, equipment: [dumbbells, incline_bench], tags: [upper, prehab], implement: dumbbell, implements: 2, load_mode: last_used, description: "Lie chest-down on an incline bench with light DBs. Raise arms into a Y, then T, then W, thumbs up, squeezing shoulder blades back and down. Small loads, no shrugging, neck neutral.", video_url: "https://www.youtube.com/watch?v=F2HZmu9KyyU"}
  pvc_pass_through: {name: PVC pass-through, equipment: [pvc_pipe], tags: [upper, warmup, mobility], load_mode: none, description: "Hold a PVC with a wide grip in front of your hips. Raise it overhead and behind you in an arc with straight arms, then back. Ribs down; widen your grip if the elbows bend or low back arches.", video_url: "https://www.youtube.com/watch?v=YW20zO__f_c"}
  hollow_hold: {name: Hollow hold, equipment: [bodyweight], muscles: [core], tags: [core, gymnastics_drill], family: kipping, rung: 0, load_mode: bodyweight, description: "Lie on your back, press low back into the floor, lift shoulders and legs with arms overhead. Hold the banana shape; bend knees or bring arms in if the low back lifts.", video_url: "https://www.youtube.com/watch?v=TNHSgs_orU0"}
  arch_hold: {name: Arch hold, equipment: [bodyweight], tags: [core, gymnastics_drill], family: kipping, rung: 0, load_mode: bodyweight, description: "Lie face-down, arms overhead. Squeeze glutes and lift arms, chest and legs slightly off the floor and hold. Keep it a gentle, long arch, eyes down; stop short of any back pinch.", video_url: "https://www.youtube.com/watch?v=Lard_TuCiWY"}
  glute_bridge: {name: Glute bridge, equipment: [bodyweight], muscles: [glutes], tags: [lower, warmup, activation], load_mode: bodyweight, hevy_title: "Glute Bridge", description: "On your back, knees bent, feet flat hip-width. Brace, then drive through the heels to lift the hips until knees, hips and shoulders line up; squeeze the glutes 2-3 s at the top. Ribs down: the movement is at the hips, not the low back."}
  lateral_band_walk: {name: Lateral band walk, equipment: [bands], muscles: [glutes], tags: [lower, warmup, activation], load_mode: none, hevy_title: "Lateral Band Walks", description: "Mini band just above the knees (or around the ankles for harder). Quarter-squat, chest up, feet hip-width. Step sideways leading with the heel, keep tension on the band and the knees pushed out; don't let the feet snap together."}
  lateral_lunge_bw: {name: Lateral lunge (bodyweight), equipment: [bodyweight], muscles: [adductors, glutes], tags: [lower, warmup, mobility], load_mode: bodyweight, hevy_title: "Lateral Lunge", description: "Wide stance. Sit back into one hip with that knee bent over the foot and the other leg straight, feeling a stretch along the straight leg's inner thigh. Chest up, heels down; push back to the middle and alternate.", sides: alternating}
  high_knee_skip: {name: A-skip (high-knee skip), equipment: [bodyweight], tags: [lower, warmup, run_drill], load_mode: bodyweight, hevy_title: "High Knee Skips", description: "Skip forward driving one knee to hip height while the other foot strikes down under your hip, on the ball of the foot. Tall posture, opposite arm drives; rhythm over speed. 15-20 m per rep."}
  bodyweight_squat: {name: Bodyweight squat (paused), equipment: [bodyweight], muscles: [quads, glutes], tags: [lower, warmup, mobility], load_mode: bodyweight, hevy_title: "Squat (Bodyweight)", description: "Feet just outside hips, arms forward. Sit down between the heels as deep as you can with a neutral spine and heels down, knees tracking over the toes. Pause 3 s at the bottom, then stand."}
  scap_pull_up: {name: Scapular pull-up, equipment: [pullup_bar], muscles: [back], tags: [upper, warmup, prehab], load_mode: bodyweight, hevy_title: "Scapular Pull Ups", description: "Dead hang, arms straight. Without bending the elbows, pull the shoulder blades down and back so your body rises an inch or two; pause 1 s, lower under control to a full hang."}
  hip_90_90_lean: {name: 90/90 front-leg lean (hip ER stretch), equipment: [bodyweight], muscles: [glutes], tags: [lower, mobility, stretch], load_mode: bodyweight, description: "Sit in 90/90: front shin across your body, back leg out to the side, both knees at 90 deg. Sit tall, then hinge forward from the hips over the front shin with a long spine until you feel the outer hip/glute of the front leg. Breathe slowly; no pinch in the front of the hip.", sides: split}
  hip_90_90_liftoff: {name: 90/90 back-knee lift-off (active hip IR), equipment: [bodyweight], muscles: [glutes], tags: [lower, mobility], load_mode: bodyweight, description: "Sit in 90/90 with hands behind you if needed. Keeping the back foot and knee level, lift the back knee and foot an inch off the floor by turning the thigh inward; hold 2 s, lower slowly. Small range is normal at first.", sides: split}
  cross_body_stretch: {name: Cross-body shoulder stretch, equipment: [bodyweight], muscles: [shoulders], tags: [upper, mobility, stretch], load_mode: bodyweight, description: "Standing or lying on your side on the arm being stretched (easier: standing). Bring the arm straight across the chest and gently pull it in at the elbow with the other hand, shoulder blade down and back; feel the back of the shoulder. Mild stretch only, never pain at the front of the shoulder.", sides: split}
  couch_prayer_stretch: {name: Couch prayer stretch (lats/overhead), equipment: [bodyweight], muscles: [back, shoulders], tags: [upper, mobility, stretch], load_mode: bodyweight, description: "Kneel facing a couch or bench, elbows on the edge shoulder-width apart, palms together. Sit the hips back toward the heels and let the chest sink, ribs down, until you feel the lats and the underside of the shoulders. Breathe slowly."}
  ohs_pvc_screen: {name: PVC overhead squat screen, equipment: [pvc_pipe], tags: [full, screen, mobility], load_mode: bodyweight, description: "Screen, not training: PVC overhead with a snatch-width grip, arms locked, feet shoulder-width. Squat as deep as you can with heels down, then hold 2 s. Film from the side (whole body in frame) and from the front; log where it breaks (heels lift, arms fall forward, low back rounds, knees cave)."}
  world_greatest_stretch: {name: World's greatest stretch, equipment: [bodyweight], tags: [full, warmup, mobility], load_mode: bodyweight, description: "From a long lunge, put both hands inside the front foot. Rotate and reach the inside arm to the ceiling, eyes following, then return. Back knee straight, hips low, turn from the upper back.", video_url: "https://www.youtube.com/watch?v=-CiWQ2IvY34", sides: either}
  hip_90_90: {name: 90/90 hip switches, equipment: [bodyweight], tags: [lower, mobility], load_mode: bodyweight, description: "Sit with both knees bent 90 deg, feet wide. Rotate both knees to one side, then the other, sitting tall. Use hands behind you for support at first; keep the trunk upright and still.", video_url: "https://www.youtube.com/watch?v=n1_ackKRYjE", sides: alternating}
  cat_cow: {name: Cat-cow, equipment: [bodyweight], tags: [core, mobility, warmup], load_mode: bodyweight, description: "On hands and knees, slowly round the spine up, then let it sag gently as you lift the chest. Small, pain-free range, move with your breath; keep it easy, not end-range.", video_url: "https://www.youtube.com/watch?v=9be19kZMqm8"}
  copenhagen_plank: {name: Copenhagen plank, equipment: [flat_bench], muscles: [adductors], tags: [lower, core, isometric], load_mode: bodyweight, regressions: [copenhagen_plank_short], hevy_title: "Copenhagen Plank", description: "Side plank on your forearm with the top leg on a bench (knee on bench = easier, ankle = harder). Lift the hips into a straight line and hold. Top leg presses down into the bench.", video_url: "https://www.youtube.com/watch?v=5cTh21BfXzI", sides: split}
  copenhagen_plank_short: {name: Short-lever Copenhagen plank, equipment: [flat_bench], muscles: [adductors], tags: [lower, core, isometric], load_mode: bodyweight, hevy_title: "Copenhagen Plank (Short Lever)", sides: split}
  foam_roll: {name: Foam roll, equipment: [bodyweight], tags: [mobility, recovery], load_mode: none, description: "Roll slowly over the target muscle (quads, calves, glutes, upper back), 30-60 s per area. Pause on tight spots and breathe. Avoid rolling directly on the low back.", video_url: "https://www.youtube.com/watch?v=vRZdDalRz0U"}
  lacrosse_ball_release: {name: Lacrosse ball release, equipment: [bodyweight], tags: [mobility, recovery], load_mode: none, description: "Pin a lacrosse ball between the tight muscle and the floor or a wall. Lean in to a moderate pressure, hold or make small movements for 30-60 s, breathe. Avoid bony spots and the spine itself.", video_url: "https://www.youtube.com/watch?v=Lc1d208RNOk"}
  band_mobility: {name: Band mobility flow, equipment: [bands], tags: [mobility, recovery], load_mode: none, description: "Easy flow with a long band: pull-aparts, pass-throughs, banded hamstring and hip openers. Slow, controlled reps; ease off any position that pinches."}
  easy_cooldown: {name: "Easy movement + slow breathing to HR < 110", equipment: [bodyweight], tags: [cooldown], load_mode: none}
  dead_hang: {name: Dead hang, equipment: [pullup_bar], tags: [cooldown, upper, decompression], load_mode: bodyweight, regressions: [child_pose_breathing], hevy_title: "Dead Hang"}
  child_pose_breathing: {name: Child's pose breathing, equipment: [bodyweight], tags: [cooldown, mobility], load_mode: none, description: "Kneel, sit hips toward heels, arms forward, forehead down. Breathe slowly through the nose into your back ribs, long exhale. Relax shoulders; prop hips on a cushion if needed.", video_url: "https://www.youtube.com/watch?v=BL8cJBCdJ2Y"}
  # ---------- movement screen + reach (logged as custom Hevy exercises) ----------
  knee_to_wall_test: {name: Knee-to-wall ankle test, equipment: [bodyweight], tags: [lower, screen, mobility], load_mode: bodyweight, description: "Facing a wall, one foot forward, heel down. Push the knee to touch the wall; slide the foot back until the heel just lifts. Measure toe-to-wall distance each side.", video_url: "https://www.youtube.com/watch?v=UzORz5em45s", sides: split}
  overhead_reach_wall_test: {name: Back-to-wall overhead reach test, equipment: [bodyweight], tags: [upper, screen, mobility], load_mode: bodyweight, description: "Stand with back, head and heels on the wall, low back flat. Raise straight arms overhead toward the wall, thumbs back. Note if thumbs reach the wall without the ribs flaring.", video_url: "https://www.youtube.com/watch?v=WgsCNDdLQOo"}
  aslr_test: {name: Active straight-leg raise test, equipment: [bodyweight], tags: [lower, screen, mobility], load_mode: bodyweight, description: "Lie on your back, legs straight. Lift one straight leg as high as you can while the other leg stays flat. Note the angle reached each side.", video_url: "https://www.youtube.com/watch?v=mLihBR_9MN8", sides: split}
  hip_rotation_test: {name: Seated hip rotation test (IR/ER), equipment: [bodyweight], tags: [lower, screen, mobility], load_mode: bodyweight, description: "Sit on a high bench, knees 90 deg, thighs still. Swing the foot out (internal rotation) then in (external rotation) as far as you can without the pelvis shifting; compare sides.", video_url: "https://www.youtube.com/watch?v=NQR5quF7grU", sides: split}
  standing_reach: {name: Standing reach, equipment: [bodyweight], tags: [screen], load_mode: bodyweight, hevy_log: inches, description: "Stand side-on to a wall, feet flat. Reach the near hand as high as you can and mark the fingertip height. This is the baseline for jump-and-touch scores.", video_url: "https://www.youtube.com/watch?v=q8rfAKawjWk"}
  standing_jump_touch: {name: Standing jump and touch, equipment: [bodyweight], tags: [lower, plyo, high_impact, power], load_mode: bodyweight, regressions: [med_ball_scoop_toss], hevy_log: inches, description: "From standing, quick dip and arm swing, jump straight up and touch the highest point you can. Land soft on both feet. Score = touch height minus standing reach.", video_url: "https://www.youtube.com/watch?v=ZwNoPMF3v_g"}
  approach_jump_touch: {name: Approach jump and touch, equipment: [bodyweight], tags: [lower, plyo, high_impact, power], load_mode: bodyweight, regressions: [standing_jump_touch], hevy_log: inches, description: "Take a 2-3 step run-up, take off from whichever feet feel natural (note one or two), swing the arms and touch as high as you can. Land soft. Full rest between attempts.", video_url: "https://www.youtube.com/watch?v=MxNSBUooSiE"}
  # ---------- power / speed ----------
  broad_jump: {name: Standing broad jump, equipment: [bodyweight], tags: [lower, plyo, high_impact, power], load_mode: bodyweight, regressions: [med_ball_scoop_toss], deload_swap: med_ball_scoop_toss, hevy_log: inches}
  box_jump: {name: Box jump (step down), equipment: [plyo_box], tags: [lower, plyo, high_impact, power, achilles_load], load_mode: bodyweight, regressions: [med_ball_scoop_toss], deload_swap: med_ball_scoop_toss, hevy_title: "Box Jump"}
  med_ball_scoop_toss: {name: Med ball scoop toss, equipment: [med_ball], tags: [full, power], load_mode: none, description: "Hold a med ball low between your legs, hip hinge with a flat back. Drive the hips and throw it up and forward with straight arms. Power comes from the hips, not the low back; reset each rep.", video_url: "https://www.youtube.com/watch?v=UmLEPjElr4s"}
  med_ball_chest_pass: {name: Med ball chest pass, equipment: [med_ball], tags: [upper, power], load_mode: none, description: "Athletic stance, ball at chest. Step or push through the legs and throw the ball hard straight out from the chest at a wall or partner. Finish with arms long; catch soft and reset.", video_url: "https://www.youtube.com/watch?v=e-zHTwXA8mE"}
  med_ball_slam: {name: Med ball slam, equipment: [med_ball], tags: [full, power, conditioning], load_mode: none, hevy_title: "Ball Slams"}
  kb_swing: {name: Kettlebell swing (Russian), equipment: [kettlebells], muscles: [glutes, hamstrings], tags: [lower, hinge, power, conditioning], implement: kettlebell, load_mode: kb, hevy_title: Kettlebell Swing}
  curve_sprint: {name: Woodway Curve sprint 10 s, equipment: [woodway_curve], tags: [lower, sprint, power, high_impact, achilles_load], load_mode: none, regressions: [bike_sprint], deload_swap: bike_sprint, description: "Stand at the front of the Curve deck, hands free. Drive into an all-out 10 s sprint, staying on the front of the belt, tall posture, quick feet; step to the rails to stop. Full rest between.", video_url: "https://www.youtube.com/watch?v=BVPUyb4q7H8"}
  track_sprint: {name: Track sprint 10 s, equipment: [bodyweight], tags: [lower, sprint, power, high_impact, achilles_load], load_mode: none, regressions: [bike_sprint], deload_swap: bike_sprint, description: "After a full warm-up, accelerate from a standing start and sprint all-out for 10 s. Push the ground back, stay tall as you rise, relaxed shoulders. Walk back; full rest between reps.", video_url: "https://www.youtube.com/watch?v=9qQ8r0eCFYw"}
  bike_sprint: {name: Echo bike sprint 10 s, equipment: [echo_bike], tags: [full, sprint, power], load_mode: none, description: "Seat set so the knee is slightly bent at the bottom. Go all-out for 10 s, pushing and pulling the handles while driving the legs. Stay seated, chest up; don't thrash side to side.", video_url: "https://www.youtube.com/watch?v=t0SgLc2dWfo"}
  # ---------- hinge family ----------
  trap_bar_deadlift_high: {name: Trap bar deadlift (high handle), equipment: [trap_bar], implement: trap_bar, muscles: [glutes, hamstrings, quads, back], tags: [lower, hinge, primary, spine_load], family: hinge, rung: 0, load_mode: e1rm, description: "Stand centred in the trap bar, grip the high handles. Brace, chest up, push the floor away and stand tall; lower under control. Neutral spine throughout, hips and shoulders rise together.", video_url: "https://www.youtube.com/watch?v=mluyMgI8QKw"}
  trap_bar_deadlift_low: {name: Trap bar deadlift (low handle), equipment: [trap_bar], implement: trap_bar, muscles: [glutes, hamstrings, quads, back], tags: [lower, hinge, primary, spine_load], family: hinge, rung: 1, regressions: [trap_bar_deadlift_high], load_mode: e1rm, estimate_from: {exercise: trap_bar_deadlift_high, factor: 0.95}, hevy_title: "Trap Bar Deadlift (Low Handle)", description: "As the high-handle version but from the low handles: more knee and hip bend. Brace, chest up, push the floor away. Only go as low as you can keep a neutral spine.", video_url: "https://www.youtube.com/watch?v=YocbPpmfUeY"}
  block_pull: {name: Block pull (mid-shin), equipment: [barbell, plyo_box], implement: barbell, muscles: [glutes, hamstrings, back], tags: [lower, hinge, primary, spine_load], family: hinge, rung: 2, regressions: [trap_bar_deadlift_low], load_mode: e1rm, estimate_from: {exercise: trap_bar_deadlift_high, factor: 0.92}, description: "Barbell on blocks so it starts at mid-shin. Set your normal deadlift grip, brace, pull slack out, then push through the floor to lockout. Neutral spine; return the bar to the blocks each rep.", video_url: "https://www.youtube.com/watch?v=-kVUTPJd7yk"}
  conventional_deadlift: {name: Conventional deadlift, equipment: [barbell], implement: barbell, muscles: [glutes, hamstrings, back], tags: [lower, hinge, primary, spine_load], family: hinge, rung: 3, regressions: [block_pull], load_mode: e1rm, hevy_title: Deadlift (Barbell), estimate_from: {exercise: trap_bar_deadlift_high, factor: 0.9}}
  rdl_db: {name: Dumbbell Romanian deadlift, equipment: [dumbbells], implement: dumbbell, muscles: [hamstrings, glutes], tags: [lower, hinge, eccentric_heavy], regressions: [hip_thrust], deload_swap: hip_thrust, implements: 2, load_mode: e1rm, hevy_title: Romanian Deadlift (Dumbbell), estimate_from: {exercise: trap_bar_deadlift_high, factor: 0.24}}
  rdl_barbell: {name: Barbell Romanian deadlift, equipment: [barbell], implement: barbell, muscles: [hamstrings, glutes], tags: [lower, hinge, eccentric_heavy, spine_load], family: hinge, rung: 1, regressions: [rdl_db], deload_swap: hip_thrust, load_mode: e1rm, hevy_title: Romanian Deadlift (Barbell), estimate_from: {exercise: trap_bar_deadlift_high, factor: 0.6}}
  single_leg_rdl_db: {name: Single-leg DB RDL, equipment: [dumbbells], implement: dumbbell, muscles: [hamstrings, glutes], tags: [lower, hinge, unilateral], regressions: [hip_thrust], load_mode: e1rm, estimate_from: {exercise: trap_bar_deadlift_high, factor: 0.16}, hevy_title: "Single Leg Romanian Deadlift (Dumbbell)", sides: split}
  hip_thrust: {name: Hip thrust (glute trainer), equipment: [glute_trainer], implement: machine, muscles: [glutes], tags: [lower, hinge], load_mode: last_used, hevy_title: Hip Thrust (Machine)}
  back_extension: {name: Back extension (45°), equipment: [back_extension], muscles: [glutes, hamstrings], tags: [lower, hinge], load_mode: bodyweight, hevy_title: "Back Extension (Hyperextension)"}
  sorensen_hold: {name: Biering-Sorensen hold, equipment: [back_extension], muscles: [back, core], tags: [core, isometric], load_mode: bodyweight, hevy_title: "Back Extension Hold"}
  ghd_hip_extension: {name: GHD hip extension, equipment: [ghd], muscles: [glutes, hamstrings], tags: [lower, hinge], regressions: [back_extension], load_mode: bodyweight, description: "Hips just past the GHD pad, feet locked. Hinge down at the hips with a braced, neutral spine, then squeeze glutes to rise to a straight line. Move at the hips only; no rounding or over-arching.", video_url: "https://www.youtube.com/watch?v=P0iuN0xygc0"}
  nordic_curl: {name: Nordic hamstring curl (GHD), equipment: [ghd], muscles: [hamstrings], tags: [lower, eccentric_heavy], regressions: [seated_leg_curl], deload_swap: seated_leg_curl, load_mode: bodyweight, hevy_title: "Nordic Hamstrings Curls"}
  seated_leg_curl: {name: Seated leg curl, equipment: [seated_leg_curl], implement: machine, muscles: [hamstrings], tags: [lower, isolation], load_mode: last_used, hevy_title: Seated Leg Curl (Machine)}
  # ---------- squat family / knee dominant ----------
  ssb_box_squat: {name: Safety squat bar box squat, equipment: [safety_squat_bar, power_rack, plyo_box], implement: safety_squat_bar, muscles: [quads, glutes], tags: [lower, squat, primary, spine_load], family: squat, rung: 0, regressions: [goblet_squat], load_mode: e1rm, description: "SSB on your traps, hold the handles. Sit back to a box at parallel, pause briefly without relaxing, then drive up. Brace hard, chest up; don't rock or round onto the box.", video_url: "https://www.youtube.com/watch?v=bc9KLkOCFxc"}
