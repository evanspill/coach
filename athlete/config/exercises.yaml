# deload_swap (concentric / low-impact alternative), skill (skills.yaml id), load_mode (e1rm | last_used | bodyweight | kb | none),
# hevy_title (Hevy exercise title used to match logged sets), hevy_template_id (filled in Phase 2),
# estimate_from (e1RM estimate from a related lift when there's no history; DB factors are per dumbbell).
