# Behaviour settings. Threshold changes live in athlete_context.json and need an approved proposal.
push:
  enabled: true           # live (athlete ended shadow mode 2026-11-14): validated plans go to Hevy / Intervals.icu
approval:
  weekly_plan: manual     # manual | auto
  daily_adjustments: auto # small changes are applied automatically
  manual_if:
    - session_type_swap   # session swapped for a different type
    - deload_pulled_forward
paused: false
notification_detail: normal   # brief | normal
validator:
  max_attempts: 3             # Claude revisions before the deterministic fallback
# Fill days the direct Whoop API missed from Intervals.icu wellness (its Whoop connection): none | intervals.
# Turn on only when Intervals.icu's HRV / resting HR / sleep come from Whoop, not a watch worn part-time.
whoop_backup: intervals
# How a pair of dumbbells/kettlebells is logged in Hevy: per_implement | total (athlete logs totals, as in Whoop;
# the coach still plans per implement and converts on push and sync).
pair_weight_logging: total
pair_weight_total_since: 2026-11-16   # first workout logged as totals (the DB press test)
