# Hybrid-athlete standards used for gap analysis. Strength ratios are e1RM / bodyweight, adapted to the
# reference variant of each test (the variant factor in tests.yaml converts other rungs).
pillars:
  neural:
    - {test: broad_jump, metric: cm, target: 250, note: "≈ 1.33 x height for a 188 cm athlete"}
  force:
    - {test: hinge_rm, metric: bw_ratio, target: [2.0, 2.25], note: "trap bar high handle e1RM"}
    - {test: squat_rm, metric: bw_ratio, target: [1.6, 1.75], note: "SSB box squat ≈ back squat 1.75 x BW"}
    - {test: db_press_5rm, metric: bw_ratio_per_hand, target: [0.42, 0.5], note: "per-hand DB e1RM; ≈ 1.25 x BW bench equivalent"}
    - {test: pullups_max, metric: reps, target: [12, 15]}
  aerobic:
    - {test: run_tt_30, metric: threshold_pace_s_per_mi, target: 420, note: "stepping stone: ≈ 7:00/mi threshold supports ~3:16 (Riegel). The Boston goal needs more; see goal_progress"}
  glycolytic:
    - {test: row_2k, metric: watts_per_kg, target: 3.4, note: "≈ 6:50 2k at 95 kg"}
