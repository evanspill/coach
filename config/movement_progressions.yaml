# Movement readiness ladders. Nothing is banned forever: each family climbs one rung at a time.
rules:
  exposures_to_advance: 3        # clean exposures at the current rung (brief: ~2-3; conservative end)
  min_days_at_rung: 14           # and at least two weeks at the rung (tissue adaptation lags performance)
  max_session_pain_to_advance: 2 # pain <= 2/10 during the session
  regress_on_session_pain_above: 2
  regress_on_next_day_flare: true
  region_flag_rating: 3          # a region rated >= 3 ...
  region_flag_consecutive: 2     # ... on 2 consecutive check-ins drops the mapped families one rung for a week
  pain_rule: >
    Discomfort > 2/10 in a session: regress range of motion or switch to an isometric next time.
    If next-morning stiffness rises: drop that movement's load ~15% and use a 3 s eccentric for 2 weeks.
families:
  hinge:
    region: back
    rungs:
      - {name: Trap bar high handle, exercises: [trap_bar_deadlift_high], min_rir: 2}
      - {name: Trap bar low handle, exercises: [trap_bar_deadlift_low, rdl_barbell], min_rir: 2}
      - {name: Block pull, exercises: [block_pull], min_rir: 2}
      - {name: Conventional deadlift from the floor, exercises: [conventional_deadlift], min_rir: 1}
  squat:
    region: back
    rungs:
      - {name: Safety squat bar box squat, exercises: [ssb_box_squat], min_rir: 2}
      - {name: Safety squat bar squat, exercises: [ssb_squat], min_rir: 2}
      - {name: High-bar back squat, exercises: [high_bar_back_squat], min_rir: 1}
  press:
    region: shoulders
    rungs:
      - {name: Neutral-grip DB press, exercises: [db_bench_press_neutral], min_rir: 2}
      - {name: Landmine press, exercises: [landmine_press], min_rir: 2}
      - {name: Converging press machine / close-grip bar, exercises: [converging_chest_press, close_grip_bench], min_rir: 2}
      - {name: Full barbell bench press, exercises: [barbell_bench_press], min_rir: 1}
  overhead:
    region: shoulders
    rungs:
      - {name: Half-kneeling landmine press, exercises: [half_kneeling_landmine_press], min_rir: 2}
      - {name: Seated neutral DB / converging shoulder press, exercises: [seated_db_press_neutral, converging_shoulder_press], min_rir: 2}
      - {name: Standing DB overhead press, exercises: [standing_db_press], min_rir: 2}
      - {name: Barbell strict press, exercises: [barbell_strict_press], min_rir: 2}
      - {name: Push press / jerk, exercises: [push_press, push_jerk], min_rir: 1}
  olympic:
    region: back
    rungs:
      - {name: Positions and drills, exercises: [snatch_positions_pvc, clean_positions_empty_bar], min_rir: 4}
      - {name: Hang and muscle variations, exercises: [hang_power_clean, muscle_snatch, overhead_squat], min_rir: 3}
      - {name: Power variations from the floor, exercises: [power_clean, hang_power_snatch], min_rir: 3}
      - {name: Full lifts from the floor, exercises: [squat_clean], min_rir: 2}
  kipping:
    region: shoulders
    rungs:
      - {name: Strict pulling + hollow/arch, exercises: [], min_rir: 2}
      - {name: Kip swing, exercises: [kip_swing], min_rir: 3}
      - {name: Kipping pull-up, exercises: [kipping_pull_up], min_rir: 3}
      - {name: Chest-to-bar / toes-to-bar, exercises: [chest_to_bar_pull_up, toes_to_bar], min_rir: 2}
      - {name: Bar muscle-up, exercises: [bar_muscle_up], min_rir: 2}
# Joint flags: a region rated >= 3 on 2 consecutive check-ins restricts these exercise tags until it is <= 2 twice in a row.
joint_flags:
  back: [spine_load, eccentric_heavy, olympic]
  shoulders: [overhead, shoulder_extension_loaded, kipping, overhead_ballistic]
  knees_achilles: [high_impact, deep_lunge, achilles_load, plyo]
