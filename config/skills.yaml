# Olympic-lift and gymnastics skills. A skill may appear in a metcon (or after fatiguing work) only once
# its current level >= competent_level. Practice 10-12 min when fresh, 1-3 reps/set, <= 70% effort.
# drills: practice exercises in order of preference; milestone: regex on chat messages -> level (by count).
skills:
  strict_pull_up:
    name: Strict pull-up
    milestone: {pattern: '(\d+)\s*strict pull[- ]?ups?', levels: {5: 2, 10: 3}}
    levels: [band-assisted, 1-4 strict, 5-9 strict, 10+ strict]
    competent_level: 2
    current_level: 2
    gate: null
  kipping_pull_up:
    name: Kipping pull-up
    milestone: {pattern: '(\d+)\s*(?:unbroken|linked|in a row)?\s*kipping pull[- ]?ups?', levels: {5: 2, 15: 3}}
    drills: [kip_swing, hollow_hold]
    levels: [hollow/arch holds, kip swings 10 tight, 5 linked kipping, 15 linked kipping unbroken]
    competent_level: 3
    current_level: 0
    gate: {family: kipping, rung: 2}
  chest_to_bar:
    name: Chest-to-bar pull-up
    drills: [kipping_pull_up, kip_swing]
    levels: [not started, strict C2B singles, kipping C2B 5 linked, kipping C2B 10 linked]
    competent_level: 3
    current_level: 0
    gate: {family: kipping, rung: 3}
  toes_to_bar:
    name: Toes-to-bar
    milestone: {pattern: '(\d+)\s*(?:unbroken|linked|in a row)?\s*(?:t2b|toes[- ]to[- ]bar)', levels: {5: 2, 10: 3}}
    drills: [kip_swing, hanging_knee_raise]
    levels: [hanging knee raise, kip swing + knee raise, 5 linked T2B, 10+ linked T2B]
    competent_level: 3
    current_level: 1
    gate: {family: kipping, rung: 3}
  bar_muscle_up:
    name: Bar muscle-up
    levels: [not started, transition drills, singles, 3+ linked]
    competent_level: 3
    current_level: 0
    gate: {family: kipping, rung: 4}
  peg_board:
    name: Peg board
    drills: [peg_board_ascent, strict_pull_up]
    levels: [strict pull + hang, partial ascent, full ascent, 2+ full ascents]
    competent_level: 2
    current_level: 0
    gate: null
  power_clean:
    name: Power clean
    milestone: {pattern: 'power cleans? from the floor (?:feel|felt|look|looked) (?:solid|consistent|good)', levels: {0: 2}}
    drills: [hang_power_clean, clean_positions_empty_bar]
    levels: [empty-bar positions, hang power clean consistent, power clean from floor consistent, touch-and-go under fatigue]
    competent_level: 2
    current_level: 1
    gate: {family: olympic, rung: 1}
  squat_clean:
    name: Squat clean
    levels: [front squat mobility, hang squat clean, squat clean from floor, cycling under fatigue]
    competent_level: 3
    current_level: 0
    gate: {family: olympic, rung: 3}
  snatch:
    name: Snatch
    drills: [muscle_snatch, snatch_positions_pvc]
    levels: [PVC positions, muscle snatch, hang power snatch, power snatch from floor]
    competent_level: 3
    current_level: 0
    gate: {family: olympic, rung: 1}
  overhead_squat:
    name: Overhead squat
    drills: [overhead_squat, snatch_positions_pvc]
    levels: [PVC OHS, empty bar OHS, light OHS 5 reps, OHS under fatigue]
    competent_level: 3
    current_level: 0
    gate: {family: overhead, rung: 3}
  jerk:
    name: Jerk / push press
    levels: [dip-drive drill, push press, push jerk, split jerk]
    competent_level: 2
    current_level: 0
    gate: {family: overhead, rung: 4}
